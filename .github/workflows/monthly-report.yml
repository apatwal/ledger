name: Monthly report

# Scheduled cron that pushes a monthly spend recap (via ntfy) on the 1st of each
# month, recapping the month that just ended. POSTs to /api/reports/monthly with
# the shared-secret header. That route is exempt from Clerk auth ONLY when the
# X-Plaid-Sync-Token matches PLAID_SYNC_TOKEN (the general cron token; see
# src/api/auth.py). No app code runs here — this is purely a scheduler hitting a URL.
#
# Setup (one-time, in GitHub repo Settings -> Secrets and variables -> Actions):
#   - Secret  PLAID_SYNC_TOKEN  = the same value set on Render (shared cron token)
#   - Variable SYNC_BASE_URL    = https://expense-tracker-2kfq.onrender.com
#     (falls back to the hardcoded default below if the variable is unset)

on:
  schedule:
    # 13:00 UTC on the 1st of every month. The endpoint defaults to the PREVIOUS
    # calendar month, so this recaps the month that just ended.
    - cron: '0 13 1 * *'
  workflow_dispatch: {} # manual "Run workflow" button for on-demand recaps

concurrency:
  group: monthly-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger monthly recap
        env:
          BASE_URL: ${{ vars.SYNC_BASE_URL || 'https://expense-tracker-2kfq.onrender.com' }}
          SYNC_TOKEN: ${{ secrets.PLAID_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SYNC_TOKEN}" ]; then
            echo "::error::PLAID_SYNC_TOKEN secret is not set on this repo."
            exit 1
          fi

          # Render free-tier web services sleep when idle, so the first request
          # after a quiet period pays a cold-start cost. Warm the service first
          # (best-effort) so the POST doesn't time out on a cold boot.
          echo "Warming service at ${BASE_URL} ..."
          curl -fsS --max-time 90 --retry 5 --retry-all-errors --retry-delay 10 \
            "${BASE_URL}/api/health" > /dev/null || echo "warm-up ping failed (continuing)"

          echo "Triggering /api/reports/monthly ..."
          # Capture body + status; retry transient failures. Fail the run on any
          # non-2xx so a broken recap surfaces as a failed-workflow email.
          http_code=$(curl -sS --max-time 120 --retry 3 --retry-delay 15 --retry-all-errors \
            -o /tmp/report_body.txt -w '%{http_code}' \
            -X POST "${BASE_URL}/api/reports/monthly" \
            -H "X-Plaid-Sync-Token: ${SYNC_TOKEN}")

          echo "HTTP ${http_code}"
          echo "Response: $(cat /tmp/report_body.txt)"
          case "${http_code}" in
            2*) echo "Monthly recap sent." ;;
            *)  echo "::error::reports/monthly returned HTTP ${http_code}"; exit 1 ;;
          esac
