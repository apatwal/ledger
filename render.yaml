services:
  - type: web
    name: expense-tracker
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    plan: free
    envVars:
      # Postgres connection string (Neon). sync:false => Render prompts for it and
      # never stores it in this file. Reuse the SAME Neon URL as local so prod
      # shares the data. If unset, the app falls back to in-container SQLite
      # (ephemeral — resets on every deploy), so set this for real persistence.
      - key: DATABASE_URL
        sync: false
      # OpenAI API key for the AI assistant / auto-categorize / insights.
      # sync:false => prompted at deploy, not committed. If unset, AI endpoints
      # return 503 and the rest of the app works normally.
      - key: OPENAI_API_KEY
        sync: false
      # Optional model override (defaults to gpt-4o-mini in code).
      # - key: OPENAI_MODEL
      #   value: gpt-4o-mini
      # Optional: the user's timezone, which sets "today" for the AI (Render runs
      # in UTC). Defaults to America/New_York in code.
      # - key: APP_TIMEZONE
      #   value: America/New_York

      # ── Authentication (Clerk) ────────────────────────────────────────────
      # Forces auth ON in prod: with REQUIRE_AUTH=true (or Render's own RENDER
      # var) the app REFUSES to boot unless CLERK_ISSUER/CLERK_JWKS_URL is set,
      # so we never deploy wide-open. Leave "true" for real deploys.
      - key: REQUIRE_AUTH
        value: "true"
      # Clerk Frontend API URL, e.g. https://<subdomain>.clerk.accounts.dev.
      # Presence of this ENABLES auth. sync:false => prompted at deploy.
      - key: CLERK_ISSUER
        sync: false
      # Clerk secret key (sk_...) — server-side email lookup fallback.
      - key: CLERK_SECRET_KEY
        sync: false
      # Comma-separated email allowlist (empty = any authenticated Clerk user).
      - key: ALLOWED_EMAILS
        sync: false
      # Frontend (Vite) Clerk publishable key (pk_...) consumed at build time.
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false

      # ── Plaid integration ─────────────────────────────────────────────────
      # sync:false => prompted at deploy, never committed. Unset => /api/plaid/*
      # network endpoints return 503 and the rest of the app works normally.
      - key: PLAID_CLIENT_ID
        sync: false
      - key: PLAID_SECRET
        sync: false
      # sandbox | development | production
      - key: PLAID_ENV
        sync: false
      # Comma-separated Plaid products, e.g. transactions,investments
      - key: PLAID_PRODUCTS
        sync: false
      # Shared secret protecting POST /api/plaid/sync-all (the scheduled cron in
      # .github/workflows/plaid-sync.yml sends it as the X-Plaid-Sync-Token
      # header). Must match the PLAID_SYNC_TOKEN GitHub Actions secret.
      - key: PLAID_SYNC_TOKEN
        sync: false
      # Public https URL of POST /api/plaid/webhook (v12). Set this, then call
      # POST /api/plaid/webhook/register once so already-linked items push
      # webhooks. Newly-linked items get it automatically via the Link token.
      - key: PLAID_WEBHOOK_URL
        sync: false

      # ── Real-time duplicate alerts (ntfy.sh) (v12) ────────────────────────
      # ntfy topic to publish duplicate-charge alerts to (subscribe in the ntfy
      # app). Unset => notifications disabled (no-op). sync:false => prompted.
      - key: NTFY_TOPIC
        sync: false
      # Optional self-hosted ntfy server base URL (defaults to https://ntfy.sh).
      - key: NTFY_SERVER
        sync: false
      # ntfy access token (tk_...). REQUIRED IN PRACTICE ON RENDER: ntfy.sh
      # rate-limits ANONYMOUS publishing per source IP, and Render's outbound IPs
      # are shared across tenants — so anonymous sends get HTTP 429 because of
      # other people's traffic. With a token, ntfy meters per-ACCOUNT instead.
      # Create a free ntfy.sh account → Account → Access tokens. sync:false =>
      # prompted at deploy, never committed. Unset => anonymous publishing.
      - key: NTFY_TOKEN
        sync: false
      # App base URL used for the alert's Click action (deep-links to /dashboard).
      - key: APP_URL
        sync: false
